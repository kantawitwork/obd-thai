name: Build macOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: เปิดใช้งานการสร้างโปรแกรม macOS
        run: flutter config --enable-macos-desktop

      - name: สร้างโฟลเดอร์ macos ของโปรเจกต์
        run: flutter create . --project-name obd_thai --org com.example --platforms=macos

      - name: เพิ่มสิทธิ์ Bluetooth และเครือข่ายให้โปรแกรม
        run: python3 tools/patch_macos.py

      - name: ติดตั้งแพ็กเกจ
        run: flutter pub get

      - name: สร้างโปรแกรม
        run: flutter build macos --release

      - name: บีบอัดโปรแกรม
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/obd_thai.app obd_thai_mac.zip

      - name: เก็บไฟล์ให้ดาวน์โหลด
        uses: actions/upload-artifact@v4
        with:
          name: obd-thai-mac
          path: obd_thai_mac.zip
